name: food_guardian
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.0
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  modal_progress_hud_nsn: ^0.5.1
  flutter_bloc: ^9.0.0
  flutter_speed_dial: ^7.0.0
  cloud_firestore: ^5.6.5
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.3
  mobile_scanner: ^3.2.0
  barcode_widget: ^2.0.4
  dio: ^5.8.0+1
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.71.0

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
